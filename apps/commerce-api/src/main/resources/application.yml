server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml

product:
  list-cache:
    ttl: 60s # 무효화가 실패했을 때 낡은 목록이 남는 상한 (D-40)

payment:
  pg: # 로컬 테스트 PG 계약. 실제 PG 가 아니며 127.0.0.1 밖의 주소는 거절한다
    base-url: http://127.0.0.1:8082
    callback-url: http://127.0.0.1:8080/api/v1/payments/callback
    user-id: "135135" # 합성 제공자 계정. 내부 고객 인증을 대신하지 않는다
    connect-timeout: 1s
    create-read-timeout: 3s # 응답 헤더를 기다리는 시간. 넘으면 결과 미확인(UNKNOWN)이다
    lookup-read-timeout: 1s

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false