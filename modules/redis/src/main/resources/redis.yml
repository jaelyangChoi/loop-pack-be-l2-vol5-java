spring:
  data:
    redis:
      repositories:
        enabled: false

datasource:
  redis:
    database: 0
    # Redis가 느리거나 멈췄을 때 호출자가 기다리는 상한(Lettuce 기본값: 연결 10초, 명령 60초)
    connect-timeout: 200ms
    command-timeout: 300ms
    master:
      host: ${REDIS_MASTER_HOST}
      port: ${REDIS_MASTER_PORT}
    replicas:
      - host: ${REDIS_REPLICA_1_HOST}
        port: ${REDIS_REPLICA_1_PORT}

---
spring.config.activate.on-profile: local, test

datasource:
  redis:
    master:
      host: localhost
      port: 6379
    replicas:
      - host: localhost
        port: 6380

---
spring.config.activate.on-profile: dev

---
spring.config.activate.on-profile: qa

---
spring.config.activate.on-profile: prd